<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>The short-time Fourier transform computed as two matrix products</title>
  <style>
    .label { fill: #1f1f1f; text-anchor: middle; }
    .small { font-size: 11.5px; fill: #555; text-anchor: middle; }
    .op { font-size: 26px; fill: #3b3b3b; text-anchor: middle; }
    .grid { stroke: #c9d3de; stroke-width: 0.8; }
  </style>
  <rect x="0" y="0" width="960" height="300" fill="#fbfaf7" rx="12"/>

  <!-- waveform being framed -->
  <path d="M20,60 q10,-25 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" stroke="#3b3b3b" fill="none" stroke-width="1.3"/>
  <rect x="20" y="35" width="80" height="50" fill="#d9822b" fill-opacity="0.18" stroke="#d9822b">
    <animate attributeName="x" values="20;60;100;140" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text class="small" x="110" y="105">overlapping windows, hop 256</text>

  <!-- frames matrix -->
  <rect x="40" y="130" width="140" height="120" fill="#fff6ec" stroke="#d9822b"/>
  <g class="grid">
    <line x1="40" y1="150" x2="180" y2="150"/><line x1="40" y1="170" x2="180" y2="170"/>
    <line x1="40" y1="190" x2="180" y2="190"/><line x1="40" y1="210" x2="180" y2="210"/>
    <line x1="40" y1="230" x2="180" y2="230"/>
  </g>
  <rect x="40" y="130" width="140" height="20" fill="#d9822b" fill-opacity="0.35">
    <animate attributeName="y" values="130;150;170;190;210;230" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text class="label" x="110" y="272">frames  F × 1024</text>

  <text class="op" x="215" y="198">·</text>

  <!-- DFT basis -->
  <rect x="245" y="130" width="120" height="120" fill="#e8f1fb" stroke="#2f6fb0"/>
  <path d="M255,190 q7,-40 14,0 t14,0 t14,0 t14,0 t14,0 t14,0 t14,0" stroke="#2f6fb0" fill="none" stroke-width="1" opacity="0.7"/>
  <text class="label" x="305" y="272">W = window ⊙ e^(−2πi kn/N)</text>
  <text class="small" x="305" y="290">1024 × 513, constant on GPU</text>

  <text class="op" x="395" y="198">=</text>

  <!-- spectrum -->
  <rect x="425" y="130" width="120" height="120" fill="#f1ecf8" stroke="#7a5aa6"/>
  <rect x="425" y="130" width="120" height="20" fill="#7a5aa6" fill-opacity="0.35">
    <animate attributeName="y" values="130;150;170;190;210;230" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text class="label" x="485" y="272">|X|²  F × 513</text>

  <text class="op" x="575" y="198">·</text>

  <!-- filterbank -->
  <rect x="605" y="130" width="90" height="120" fill="#eaf5ee" stroke="#3a9a5b"/>
  <path d="M610,245 l8,-30 l8,30 M620,245 l10,-40 l10,40 M634,245 l14,-55 l14,55 M652,245 l20,-75 l20,75" stroke="#3a9a5b" fill="none" stroke-width="1"/>
  <text class="label" x="650" y="272">mel filters</text>
  <text class="small" x="650" y="290">513 × 128</text>

  <text class="op" x="725" y="198">=</text>

  <!-- log mel -->
  <rect x="755" y="130" width="70" height="120" fill="#eef3ea" stroke="#3a9a5b"/>
  <rect x="755" y="130" width="70" height="20" fill="#3a9a5b" fill-opacity="0.35">
    <animate attributeName="y" values="130;150;170;190;210;230" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text class="label" x="790" y="272">ln(mel)</text>
  <text class="small" x="790" y="290">F × 128</text>

  <text x="850" y="170" font-size="12.5" fill="#444">One GEMM kernel</text>
  <text x="850" y="188" font-size="12.5" fill="#444">serves feature</text>
  <text x="850" y="206" font-size="12.5" fill="#444">extraction and</text>
  <text x="850" y="224" font-size="12.5" fill="#444">the Transformer.</text>
</svg>
