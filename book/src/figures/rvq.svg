<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Residual vector quantisation, level by level</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b3b3b"/>
    </marker>
  </defs>
  <style>
    .label { fill: #1f1f1f; text-anchor: middle; }
    .small { font-size: 11.5px; fill: #555; text-anchor: middle; }
    .centroid { fill: #9aa0a6; }
  </style>
  <rect x="0" y="0" width="960" height="330" fill="#fbfaf7" rx="12"/>

  <!-- level 0 panel -->
  <rect x="20" y="20" width="290" height="240" fill="#ffffff" stroke="#ccc" rx="8"/>
  <text class="label" x="165" y="44">level 0: coarse</text>
  <g class="centroid">
    <circle cx="70" cy="90" r="4"/><circle cx="130" cy="200" r="4"/><circle cx="250" cy="110" r="4"/>
    <circle cx="200" cy="220" r="4"/><circle cx="90" cy="160" r="4"/><circle cx="270" cy="200" r="4"/>
  </g>
  <circle cx="230" cy="150" r="6" fill="#d9822b"/>
  <text class="small" x="214" y="166">x</text>
  <circle cx="250" cy="110" r="7" fill="none" stroke="#2f6fb0" stroke-width="2">
    <animate attributeName="opacity" values="0;1;1;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <line x1="234" y1="143" x2="247" y2="117" stroke="#d9822b" stroke-width="2" marker-end="url(#head)">
    <animate attributeName="opacity" values="0;0;1;1" dur="6s" repeatCount="indefinite"/>
  </line>
  <text class="small" x="165" y="250">nearest centroid gives the level-0 code</text>

  <!-- level 1 panel (zoomed residual space) -->
  <rect x="335" y="20" width="290" height="240" fill="#ffffff" stroke="#ccc" rx="8"/>
  <text class="label" x="480" y="44">level 1: what level 0 missed</text>
  <g class="centroid">
    <circle cx="420" cy="100" r="4"/><circle cx="530" cy="90" r="4"/><circle cx="460" cy="190" r="4"/>
    <circle cx="560" cy="180" r="4"/><circle cx="390" cy="200" r="4"/>
  </g>
  <circle cx="545" cy="170" r="6" fill="#d9822b">
    <animate attributeName="opacity" values="0;0;1;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="180" r="7" fill="none" stroke="#2f6fb0" stroke-width="2">
    <animate attributeName="opacity" values="0;0;0;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="480" y="250">same rule on the residual gives the level-1 code</text>

  <!-- error bars -->
  <rect x="650" y="20" width="290" height="240" fill="#ffffff" stroke="#ccc" rx="8"/>
  <text class="label" x="795" y="44">reconstruction error (schematic)</text>
  <g>
    <rect x="690" y="80" width="40" height="150" fill="#d9822b" fill-opacity="0.75"/>
    <rect x="750" y="140" width="40" height="90" fill="#d9822b" fill-opacity="0.6"/>
    <rect x="810" y="175" width="40" height="55" fill="#d9822b" fill-opacity="0.45"/>
    <rect x="870" y="195" width="40" height="35" fill="#d9822b" fill-opacity="0.3"/>
  </g>
  <line x1="680" y1="230" x2="920" y2="230" stroke="#3b3b3b"/>
  <text class="small" x="710" y="248">1</text><text class="small" x="770" y="248">2</text>
  <text class="small" x="830" y="248">3</text><text class="small" x="890" y="248">4</text>
  <text class="small" x="795" y="270">codebooks used</text>

  <text x="20" y="300" font-size="13" fill="#333">A 21 ms step of audio (two log-mel frames, 256 numbers) becomes four integers, one per codebook, coarse to fine.</text>
  <text x="20" y="320" font-size="13" fill="#333">Decoding sums the four chosen centroids; each level removes part of what the previous levels missed.</text>
</svg>
