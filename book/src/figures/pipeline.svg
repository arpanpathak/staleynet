<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>StaleyNET end-to-end pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b3b3b"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #3b3b3b; stroke-width: 1.4; rx: 8; }
      .gpu { fill: #e8f1fb; stroke: #2f6fb0; }
      .cpu { fill: #f6f1e7; stroke: #a07a3a; }
      .label { fill: #1f1f1f; text-anchor: middle; }
      .small { font-size: 11.5px; fill: #555; text-anchor: middle; }
      .edge { stroke: #3b3b3b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .lane { font-size: 12px; fill: #777; font-weight: bold; letter-spacing: 1px; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#fbfaf7" rx="12"/>

  <text x="20" y="34" class="lane">TRAINING DATA</text>
  <text x="20" y="214" class="lane">GENERATION</text>
  <line x1="20" y1="180" x2="940" y2="180" stroke="#ddd" stroke-dasharray="4 4"/>

  <!-- training lane -->
  <rect class="box cpu" x="20" y="52" width="120" height="58"/>
  <text class="label" x="80" y="78">Recording</text>
  <text class="small" x="80" y="96">mp3 · any rate</text>

  <rect class="box cpu" x="175" y="52" width="130" height="58"/>
  <text class="label" x="240" y="78">Resample</text>
  <text class="small" x="240" y="96">24 kHz · −20 dBFS</text>

  <rect class="box gpu" x="340" y="52" width="130" height="58"/>
  <text class="label" x="405" y="78">Log-mel</text>
  <text class="small" x="405" y="96">STFT as GEMM</text>

  <rect class="box gpu" x="505" y="52" width="140" height="58"/>
  <text class="label" x="575" y="78">RVQ tokenizer</text>
  <text class="small" x="575" y="96">4 × 1024 codes / step</text>

  <rect class="box gpu" x="700" y="52" width="240" height="58"/>
  <text class="label" x="820" y="76">Transformer (teacher-forced)</text>
  <text class="small" x="820" y="96">caption bytes → next audio codes</text>

  <path class="edge" d="M140,81 H173"/>
  <path class="edge" d="M305,81 H338"/>
  <path class="edge" d="M470,81 H503"/>
  <path class="edge" d="M645,81 H698"/>

  <rect class="box cpu" x="700" y="128" width="240" height="34"/>
  <text class="small" x="820" y="150">caption: “upbeat pop, female vocals…”</text>
  <path class="edge" d="M820,128 V112"/>

  <!-- generation lane -->
  <rect class="box cpu" x="20" y="236" width="150" height="58"/>
  <text class="label" x="95" y="262">Prompt</text>
  <text class="small" x="95" y="280">UTF-8 bytes</text>

  <rect class="box gpu" x="205" y="236" width="220" height="58"/>
  <text class="label" x="315" y="260">Transformer + KV cache</text>
  <text class="small" x="315" y="280">sample codes step by step</text>

  <rect class="box gpu" x="460" y="236" width="140" height="58"/>
  <text class="label" x="530" y="262">RVQ decode</text>
  <text class="small" x="530" y="280">codes → log-mel</text>

  <rect class="box cpu" x="635" y="236" width="140" height="58"/>
  <text class="label" x="705" y="262">Griffin-Lim</text>
  <text class="small" x="705" y="280">phase recovery</text>

  <rect class="box cpu" x="810" y="236" width="130" height="58"/>
  <text class="label" x="875" y="262">WAV</text>
  <text class="small" x="875" y="280">24 kHz mono</text>

  <path class="edge" d="M170,265 H203"/>
  <path class="edge" d="M425,265 H458"/>
  <path class="edge" d="M600,265 H633"/>
  <path class="edge" d="M775,265 H808"/>

  <!-- feedback loop of autoregression -->
  <path d="M380,294 C380,325 250,325 250,296" stroke="#2f6fb0" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="315" y="330" class="small">each sampled step is fed back</text>

  <!-- moving tokens -->
  <circle r="5" fill="#d9822b">
    <animateMotion dur="5s" repeatCount="indefinite" path="M80,81 H820"/>
  </circle>
  <circle r="5" fill="#2f6fb0">
    <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M95,265 H875"/>
  </circle>

  <!-- legend -->
  <rect x="420" y="190" width="14" height="12" class="box gpu"/>
  <text x="440" y="200" font-size="12" fill="#444">runs on the GPU (cuda-oxide)</text>
  <rect x="640" y="190" width="14" height="12" class="box cpu"/>
  <text x="660" y="200" font-size="12" fill="#444">runs on the CPU</text>
</svg>
