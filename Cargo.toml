[workspace]
resolver = "3"
members = [
    "crates/staleynet-audio",
    "crates/staleynet-cuda",
    "crates/staleynet-model",
    "crates/staleynet-data",
    "crates/staleynet-train",
    "crates/staleynet-cli",
]
default-members = ["crates/staleynet-cli"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# cuda-oxide follows upstream main, and Cargo.lock records the commit that was
# last built and tested. To move to a newer cuda-oxide, run
#     cargo update -p cuda-core -p cuda-device -p cuda-host
# and set rust-toolchain.toml to the channel of cuda-oxide/rust-toolchain.toml.
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", branch = "main" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", branch = "main" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", branch = "main" }
libm = "0.2"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
half = "2"
hound = "3.5"
rayon = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm"] }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2
