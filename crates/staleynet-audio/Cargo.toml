[package]
name = "staleynet-audio"
description = "Pure-Rust audio front end for music models: decode MP3/FLAC/WAV/OGG to mono, polyphase resampling, log-mel spectrograms (STFT as a matrix product) and fast Griffin-Lim reconstruction."
authors = ["Arpan Pathak"]
readme = "README.md"
repository = "https://github.com/arpanpathak/staleynet"
homepage = "https://github.com/arpanpathak/staleynet"
documentation = "https://docs.rs/staleynet-audio"
keywords = ["audio", "music", "dsp", "mel", "griffin-lim"]
categories = ["multimedia::audio", "science"]
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
hound.workspace = true
rayon.workspace = true
rustfft.workspace = true
symphonia.workspace = true
