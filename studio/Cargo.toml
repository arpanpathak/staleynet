[package]
name = "staleynet-studio"
description = "A small browser studio for generating and listening to StaleyNET samples."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Standalone: not part of the GPU workspace, builds with plain `cargo`.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
